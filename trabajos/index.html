<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter de Osmán</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        text-decoration: none;
        list-style: none;
        box-sizing: border-box;
    }
    #wrapper {
        width: 80%;
        height: 70vh;
        margin: 0 auto;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: column;
    }
    #botones {
        width: 80%;
        height: 75%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        a {
            width: 40%;
            aspect-ratio: 1/1;
            outline: 1px solid black;
            border-radius: 20px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            box-shadow: inset 3px 3px 10px white,
                        inset -3px -3px 10px black;
        }
        a:active {
            box-shadow: inset 3px 3px 10px black,
                        inset -3px -3px 10px white;
        }
        #shima-enaga {
            background-color: rgb(232, 232, 232);
        }
        #mitologia-griega {
            background-color: #0f85fa;
        }
        img {
            width: 80%;
            aspect-ratio: 1/1;
        }
        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: black;
        }
    }
</style>
<body>
    <div id="wrapper">
        <h1>NEWSLETTER DE OSMÁN</h1>
        <div id="botones">
            <a id="shima-enaga" href="newsletter-shima-enaga/index.html">
                <img src="newsletter-shima-enaga/img/shima-enaga-logo.png" alt="Shima Enaga">
                <p>Newsletter Shima-Enaga</p>
            </a>
            <a id="mitologia-griega" href="newsletter-mitologia-griega/index.html">
                <img src="newsletter-mitologia-griega/img/header-img.png" alt="Partenón">
                <p>Newsletter Mitología griega</p>
            </a>
        </div>
    </div>
</body>
</html>
